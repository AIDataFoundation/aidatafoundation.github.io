name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup BEAM (Elixir & Erlang/OTP)
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3'

      - name: Cache Mix & Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            _build
            deps
          key: pages-v3-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            pages-v3-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Setup asset build tools
        run: mix assets.setup

      - name: Compile and verify
        run: mix compile --warnings-as-errors

      - name: Run test suite
        run: mix test

      - name: Build and digest assets
        run: mix assets.deploy

      - name: Export static website
        run: mix aidatafoundation.export --output _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
