<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none">
  <defs>
    <!-- Vibrant Brand Gradients -->
    <linearGradient id="adfGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="adfGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="adfGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="adfAiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="adfAiGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="adfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>

    <style>
      .adf-word-ai {
        fill: url(#adfAiGrad);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 21px;
        letter-spacing: -0.02em;
      }
      .adf-word-data {
        fill: #0f172a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 21px;
        letter-spacing: -0.01em;
      }
      .adf-word-foundation {
        fill: #64748b;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 9px;
        letter-spacing: 0.28em;
      }

      /* Automatic Dark Mode Adaptation */
      @media (prefers-color-scheme: dark) {
        .adf-word-ai { fill: url(#adfAiGradDark); }
        .adf-word-data { fill: #f8fafc; }
        .adf-word-foundation { fill: #94a3b8; }
      }
    </style>
  </defs>

  <!-- Isometric Foundation Neural Cube Emblem -->
  <g transform="translate(4, 0)" filter="url(#adfGlow)">
    <!-- Top Face (AI Layer) -->
    <polygon points="20,4 36,13.24 20,22.48 4,13.24" fill="url(#adfGradTop)" />
    <!-- Left Face (Data Layer) -->
    <polygon points="4,13.24 20,22.48 20,41 4,31.76" fill="url(#adfGradLeft)" />
    <!-- Right Face (Foundation Infrastructure Layer) -->
    <polygon points="20,22.48 36,13.24 36,31.76 20,41" fill="url(#adfGradRight)" />

    <!-- Isometric Internal Grid / Neural Pathways -->
    <path d="M4 13.24 L20 22.48 L36 13.24" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" opacity="0.85" />
    <path d="M20 22.48 L20 41" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
    
    <!-- Diagonal Synaptic Lines -->
    <path d="M12 8.62 L28 17.86" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.6" />
    <path d="M12 27.12 L20 22.48 L28 36.38" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.5" />

    <!-- Precision Neural Nodes -->
    <circle cx="20" cy="4" r="2.2" fill="#c4b5fd" stroke="#ffffff" stroke-width="0.75" />
    <circle cx="36" cy="13.24" r="2.2" fill="#67e8f9" stroke="#ffffff" stroke-width="0.75" />
    <circle cx="36" cy="31.76" r="2.2" fill="#38bdf8" stroke="#ffffff" stroke-width="0.75" />
    <circle cx="20" cy="41" r="2.2" fill="#818cf8" stroke="#ffffff" stroke-width="0.75" />
    <circle cx="4" cy="31.76" r="2.2" fill="#a78bfa" stroke="#ffffff" stroke-width="0.75" />
    <circle cx="4" cy="13.24" r="2.2" fill="#c4b5fd" stroke="#ffffff" stroke-width="0.75" />
    
    <!-- Central Radiant Core Node -->
    <circle cx="20" cy="22.48" r="3.2" fill="#ffffff" />
    <circle cx="20" cy="22.48" r="1.5" fill="#6366f1" />
  </g>

  <!-- Authoritative Wordmark -->
  <g transform="translate(54, 0)">
    <!-- Line 1: AI DATA -->
    <text x="0" y="25" class="adf-word-ai">AI</text>
    <text x="27" y="25" class="adf-word-data">DATA</text>
    <!-- Line 2: FOUNDATION -->
    <text x="1" y="38" class="adf-word-foundation">FOUNDATION</text>
  </g>
</svg>
