<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none">
  <defs>
    <linearGradient id="secGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="secGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="secGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="secGradAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="secGradAIDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="secGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#059669" flood-opacity="0.35" />
    </filter>
    <style>
      .adf-word-ai { fill: url(#secGradAI); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 21px; letter-spacing: -0.02em; }
      .adf-word-data { fill: #0f172a; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.01em; }
      .adf-word-foundation { fill: #475569; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 9px; letter-spacing: 0.28em; }
      @media (prefers-color-scheme: dark) {
        .adf-word-ai { fill: url(#secGradAIDark); }
        .adf-word-data { fill: #f8fafc; }
        .adf-word-foundation { fill: #94a3b8; }
      }
    </style>
  </defs>

  <!-- Shield Emblem -->
  <g transform="translate(4, 8)" filter="url(#secGlow)">
    <!-- Shield background -->
    <path d="M20 2 L36 8 L36 22 Q36 36 20 42 Q4 36 4 22 L4 8 Z" fill="url(#secGradTop)" stroke="#064e3b" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Inner shield -->
    <path d="M20 6 L32 11 L32 23 Q32 33 20 38 Q8 33 8 23 L8 11 Z" fill="url(#secGradLeft)" opacity="0.9" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Lock / Security icon -->
    <rect x="13" y="18" width="14" height="11" rx="1.5" fill="#ffffff" opacity="0.95"/>
    <path d="M17 18 V13 A3 3 0 0 1 23 13 V18" stroke="#047857" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="20" cy="23" r="1.2" fill="#047857"/>
    <!-- Grid lines -->
    <line x1="4" y1="22" x2="36" y2="22" stroke="#ffffff" stroke-width="0.6" opacity="0.45"/>
    <line x1="20" y1="6" x2="20" y2="38" stroke="#ffffff" stroke-width="0.6" opacity="0.45"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(54, 0)">
    <text x="0" y="25" class="adf-word-ai">AI</text>
    <text x="27" y="25" class="adf-word-data">DATA</text>
    <text x="1" y="38" class="adf-word-foundation">FOUNDATION</text>
  </g>
</svg>
